<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Status Overlay</title>
    <style>
        @font-face {
            font-family: 'Inconsolata';
            src: url('./Inconsolata-LXGWMono-Medium.ttf') format('truetype');
        }

        * {
            box-sizing: border-box;
        }

        :root {
            --ui-scale: 1;
            --background-min-opacity: 0.5;
            --blink-duration: 1s;
            --wood-dark: #4d2819;
            --wood-mid: #91502d;
            --wood-light: #c4773e;
            --paper: #f1cf82;
            --paper-light: #ffe6a2;
            --ink: #4a2c21;
            --leaf: #4f7138;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Inconsolata', monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            /* OBS 高清优化 */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: geometricPrecision;
        }

        .terminal {
            position: relative;
            isolation: isolate;
            border: calc(3px * var(--ui-scale)) solid transparent;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .terminal::before {
            content: "";
            position: absolute;
            z-index: -1;
            inset: calc(-3px * var(--ui-scale));
            pointer-events: none;
            opacity: var(--background-min-opacity);
            background:
                repeating-linear-gradient(
                    2deg,
                    rgba(74, 35, 20, 0.12) 0,
                    rgba(74, 35, 20, 0.12) calc(1px * var(--ui-scale)),
                    transparent calc(1px * var(--ui-scale)),
                    transparent calc(8px * var(--ui-scale))),
                linear-gradient(90deg, #7b3e24 0%, #b76535 18%, #9b4f2b 50%, #bd6e39 78%, #7b3e24 100%);
            border: calc(3px * var(--ui-scale)) solid var(--wood-dark);
            box-shadow:
                inset 0 0 0 calc(2px * var(--ui-scale)) rgba(228, 153, 76, 0.65),
                inset 0 0 calc(8px * var(--ui-scale)) rgba(56, 27, 17, 0.45),
                0 calc(3px * var(--ui-scale)) 0 rgba(45, 24, 16, 0.72),
                0 0 calc(8px * var(--ui-scale)) rgba(35, 20, 14, 0.22);
        }

        .terminal::after {
            content: "";
            position: absolute;
            z-index: 5;
            inset: 0;
            pointer-events: none;
            opacity: var(--background-min-opacity);
            background:
                radial-gradient(circle at calc(6px * var(--ui-scale)) calc(6px * var(--ui-scale)), #f2c879 0 calc(1px * var(--ui-scale)), #6d3a23 calc(1.2px * var(--ui-scale)) calc(2.6px * var(--ui-scale)), transparent calc(2.8px * var(--ui-scale))),
                radial-gradient(circle at calc(100% - 6px * var(--ui-scale)) calc(6px * var(--ui-scale)), #f2c879 0 calc(1px * var(--ui-scale)), #6d3a23 calc(1.2px * var(--ui-scale)) calc(2.6px * var(--ui-scale)), transparent calc(2.8px * var(--ui-scale))),
                radial-gradient(circle at calc(6px * var(--ui-scale)) calc(100% - 6px * var(--ui-scale)), #f2c879 0 calc(1px * var(--ui-scale)), #6d3a23 calc(1.2px * var(--ui-scale)) calc(2.6px * var(--ui-scale)), transparent calc(2.8px * var(--ui-scale))),
                radial-gradient(circle at calc(100% - 6px * var(--ui-scale)) calc(100% - 6px * var(--ui-scale)), #f2c879 0 calc(1px * var(--ui-scale)), #6d3a23 calc(1.2px * var(--ui-scale)) calc(2.6px * var(--ui-scale)), transparent calc(2.8px * var(--ui-scale)));
        }

        .title-bar {
            position: relative;
            z-index: 6;
            opacity: 1;
            flex: 0 0 auto;
            overflow: hidden;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(67, 29, 16, 0.14) 0,
                    rgba(67, 29, 16, 0.14) calc(1px * var(--ui-scale)),
                    transparent calc(1px * var(--ui-scale)),
                    transparent calc(7px * var(--ui-scale))),
                linear-gradient(90deg, #7c3e24 0%, #a95a30 32%, #b96836 50%, #a95a30 68%, #7c3e24 100%);
            margin: calc(6px * var(--ui-scale)) calc(5px * var(--ui-scale)) 0;
            padding: calc(4px * var(--ui-scale)) calc(16px * var(--ui-scale));
            display: flex;
            align-items: center;
            border: calc(2px * var(--ui-scale)) solid var(--wood-dark);
            box-shadow:
                inset 0 0 0 calc(1px * var(--ui-scale)) rgba(235, 167, 91, 0.52),
                0 calc(2px * var(--ui-scale)) 0 rgba(69, 33, 20, 0.72);
        }

        .title-bar::before,
        .title-bar::after {
            content: "";
            position: absolute;
            z-index: 2;
            top: 50%;
            width: calc(5px * var(--ui-scale));
            height: calc(5px * var(--ui-scale));
            border: calc(1px * var(--ui-scale)) solid #60311d;
            border-radius: 50%;
            background: #e5b766;
            box-shadow: inset calc(-1px * var(--ui-scale)) calc(-1px * var(--ui-scale)) 0 #9b6333;
            transform: translateY(-50%);
        }

        .title-bar::before {
            left: calc(5px * var(--ui-scale));
        }

        .title-bar::after {
            right: calc(5px * var(--ui-scale));
        }

        .title-text {
            position: relative;
            z-index: 1;
            font-size: calc(24px * var(--ui-scale));
            font-weight: bold;
            line-height: 1.1;
            flex-grow: 1;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #title {
            color: #ffe9a7;
            text-shadow:
                calc(2px * var(--ui-scale)) calc(2px * var(--ui-scale)) 0 #542a1b,
                0 calc(-1px * var(--ui-scale)) 0 rgba(255, 244, 193, 0.3);
        }

        .content {
            position: relative;
            z-index: 1;
            isolation: isolate;
            margin: calc(4px * var(--ui-scale)) calc(6px * var(--ui-scale));
            padding:
                calc(6px * var(--ui-scale))
                calc(9px * var(--ui-scale))
                calc(2px * var(--ui-scale));
            border: calc(2px * var(--ui-scale)) solid transparent;
            color: var(--ink);
            font-size: calc(22px * var(--ui-scale));
            font-weight: 600;
            line-height: 1.35;
            white-space: pre-wrap;
            flex-grow: 1;
            overflow: hidden;
            text-align: left;
            text-shadow: 0 calc(1px * var(--ui-scale)) 0 rgba(255, 245, 196, 0.5);
            overflow-wrap: break-word;
            word-break: break-all;
        }

        .content::before {
            content: "";
            position: absolute;
            z-index: -1;
            inset: calc(-2px * var(--ui-scale));
            pointer-events: none;
            opacity: var(--background-min-opacity);
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(105, 61, 31, 0.035) 0,
                    rgba(105, 61, 31, 0.035) calc(1px * var(--ui-scale)),
                    transparent calc(1px * var(--ui-scale)),
                    transparent calc(5px * var(--ui-scale))),
                radial-gradient(circle at 14% 18%, rgba(255, 242, 177, 0.72), transparent 42%),
                linear-gradient(145deg, var(--paper-light), var(--paper));
            border: calc(2px * var(--ui-scale)) solid #683820;
            box-shadow:
                inset 0 0 0 calc(2px * var(--ui-scale)) rgba(255, 236, 166, 0.62),
                0 calc(2px * var(--ui-scale)) 0 rgba(70, 34, 20, 0.68);
        }

        .cursor {
            background: var(--leaf);
            color: #fff0b0;
            display: inline; /* 关键：改为 inline 避免破坏换行 */
            padding: calc(1px * var(--ui-scale)) 0;
        }

        .selection {
            background: rgba(165, 80, 39, 0.24);
            color: #3d241b;
        }

        .content-copy {
            opacity: var(--background-min-opacity);
        }

        .selection-cursor {
            display: inline-block;
            width: calc(2px * var(--ui-scale));
            height: 1em;
            margin: 0 calc(-1px * var(--ui-scale));
            vertical-align: -0.14em;
        }

        .terminal.is-blinking::before,
        .terminal.is-blinking::after,
        .terminal.is-blinking .content::before,
        .terminal.is-blinking .content-copy {
            animation: background-breathe var(--blink-duration) ease-in-out infinite;
        }

        .terminal.is-blinking .cursor,
        .terminal.is-blinking .selection-cursor {
            animation: blink var(--blink-duration) ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes background-breathe {
            0%, 100% { opacity: var(--background-min-opacity); }
            50% { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .terminal.is-blinking::before,
            .terminal.is-blinking::after,
            .terminal.is-blinking .content::before,
            .terminal.is-blinking .content-copy,
            .terminal.is-blinking .cursor,
            .terminal.is-blinking .selection-cursor {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="terminal is-blinking">
        <div class="title-bar">
            <div class="title-text"><span id="title">KanBan 看板</span></div>
        </div>
        <div id="content" class="content">Initializing...<span class="cursor"></span></div>
    </div>

    <script>
        const designWidth = 291;
        const designHeight = 159;
        const signalRScriptUrl = "https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js";

        function updateUiScale() {
            const widthScale = window.innerWidth / designWidth;
            const heightScale = window.innerHeight / designHeight;
            const scale = Math.max(1, Math.min(widthScale, heightScale));
            document.documentElement.style.setProperty("--ui-scale", scale.toString());
        }

        updateUiScale();
        window.addEventListener("resize", updateUiScale);

        const colors = [
            '#355e3b', // leaf green
            '#8b3f4d', // berry
            '#2f6570', // lake blue
            '#70432f', // soil
            '#a44f2a', // pumpkin
            '#5d6f32', // olive
            '#675071', // wild plum
            '#8b5c20'  // harvest gold
        ];

        function escapeHtml(text) {
            if (!text) return "";
            return text.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function normalizeSelectionDirection(direction) {
            return direction === "forward" || direction === "backward" ? direction : "none";
        }

        function normalizeSelection(message, cursorPosition, selectionStart, selectionEnd, selectionDirection) {
            const length = message.length;
            const clamp = (value) => Math.max(0, Math.min(Number.isInteger(value) ? value : 0, length));
            const start = clamp(Number.isInteger(selectionStart) ? selectionStart : cursorPosition);
            const end = clamp(Number.isInteger(selectionEnd) ? selectionEnd : start);
            const normalizedStart = Math.min(start, end);
            const normalizedEnd = Math.max(start, end);
            const direction = normalizeSelectionDirection(selectionDirection);
            const cursor = clamp(Number.isInteger(cursorPosition)
                ? cursorPosition
                : direction === "backward" && normalizedStart !== normalizedEnd
                    ? normalizedStart
                    : normalizedEnd);

            return {
                cursorPosition: cursor,
                selectionStart: normalizedStart,
                selectionEnd: normalizedEnd,
                hasSelection: normalizedStart !== normalizedEnd
            };
        }

        function renderColoredContent(message, cursorPosition, selectionStart, selectionEnd, selectionDirection) {
            const msg = message || "";
            const selection = normalizeSelection(msg, cursorPosition, selectionStart, selectionEnd, selectionDirection);
            let resultHtml = "";
            let currentLineIndex = 0;
            
            const startSpan = (idx) => `<span class="content-copy" style="color: ${colors[idx % colors.length]}">`;
            const selectionCursor = (idx) => {
                const color = colors[idx % colors.length];
                return `<span class="selection-cursor" style="background: ${color};"></span>`;
            };
            
            resultHtml += startSpan(currentLineIndex);
            
            for (let i = 0; i <= msg.length; i++) {
                if (selection.hasSelection && (i === selection.selectionStart || i === selection.selectionEnd)) {
                    resultHtml += `</span>${selectionCursor(currentLineIndex)}${startSpan(currentLineIndex)}`;
                }

                if (!selection.hasSelection && i === selection.cursorPosition) {
                    const color = colors[currentLineIndex % colors.length];
                    const charAtCursor = msg[i] || " ";
                    if (charAtCursor === '\n') {
                        resultHtml += `</span><span class="cursor" style="background: ${color}; color: #fff0b0;">&nbsp;</span>${startSpan(currentLineIndex)}`;
                    } else {
                        resultHtml += `</span><span class="cursor" style="background: ${color}; color: #fff0b0;">${escapeHtml(charAtCursor)}</span>${startSpan(currentLineIndex)}`;
                        continue; // Skip the character we just rendered as cursor
                    }
                }
                
                if (i < msg.length) {
                    const char = msg[i];
                    if (char === '\n') {
                        resultHtml += `</span>\n`;
                        currentLineIndex++;
                        resultHtml += startSpan(currentLineIndex);
                    } else {
                        const escapedChar = escapeHtml(char);
                        resultHtml += selection.hasSelection && i >= selection.selectionStart && i < selection.selectionEnd
                            ? `<span class="selection">${escapedChar}</span>`
                            : escapedChar;
                    }
                }
            }
            
            resultHtml += `</span>`;
            return resultHtml;
        }

        function applyStatus(message, cursorPosition, selectionStart, selectionEnd, selectionDirection) {
            const contentDiv = document.getElementById("content");
            contentDiv.innerHTML = renderColoredContent(message, cursorPosition, selectionStart, selectionEnd, selectionDirection);

            // Cursor nodes are recreated on every status update. Restart the shared
            // animation so the cursor and the background always stay in opposite phases.
            const terminal = document.querySelector(".terminal");
            terminal.classList.remove("is-blinking");
            void terminal.offsetWidth;
            terminal.classList.add("is-blinking");
        }

        function applyTitle(title) {
            document.getElementById("title").innerText = title;
        }

        async function loadInitialStatus() {
            try {
                const response = await fetch("/api/status", { cache: "no-store" });
                if (!response.ok) {
                    return;
                }

                const state = await response.json();
                applyTitle(state.title || "");
                applyStatus(
                    state.status || "",
                    Number.isInteger(state.cursorPosition) ? state.cursorPosition : 0,
                    Number.isInteger(state.selectionStart) ? state.selectionStart : state.cursorPosition,
                    Number.isInteger(state.selectionEnd) ? state.selectionEnd : state.cursorPosition,
                    state.selectionDirection || "none");
            } catch (err) {
                console.error("Failed to load initial status", err);
            }
        }

        function loadSignalRClient() {
            return new Promise((resolve, reject) => {
                if (window.signalR) {
                    resolve();
                    return;
                }

                const script = document.createElement("script");
                script.src = signalRScriptUrl;
                script.onload = resolve;
                script.onerror = () => reject(new Error("SignalR client script failed to load."));
                document.head.appendChild(script);
            });
        }

        async function startRealtimeConnection() {
            try {
                await loadSignalRClient();

                const connection = new signalR.HubConnectionBuilder()
                    .withUrl("/statusHub")
                    .withAutomaticReconnect()
                    .build();

                connection.on("ReceiveStatus", (message, cursorPosition, selectionStart, selectionEnd, selectionDirection, revision) => {
                    applyStatus(message, cursorPosition, selectionStart, selectionEnd, selectionDirection);
                });

                connection.on("ReceiveTitle", applyTitle);

                await connection.start();
            } catch (err) {
                console.error(err);
                setTimeout(startRealtimeConnection, 5000);
            }
        }

        loadInitialStatus();
        startRealtimeConnection();
    </script>
</body>
</html>
